# CloudCannon setup for the MAPS site.
# "Pages" lists every page for the Visual Editor.
# "Services & photos" holds one list per side: each service has a name,
# a short description and its own photos. Adding, renaming, reordering or
# removing a service there updates the service cards, the Projects page
# filter buttons, the slideshow and the gallery together.
collections_config:
  pages:
    path: /
    name: Pages
    glob:
      - index.html
      - residential.html
      - commercial.html
      - residential-projects.html
      - commercial-projects.html
    output: true
    icon: web
  data:
    path: data
    name: Services & photos
    icon: photo_library
    disable_add: true
    disable_add_folder: true

_inputs:
  services:
    type: array
    label: Services
    comment: Shown as the service cards (residential) or the scope list (commercial), in this order.
    options:
      structures: _structures.services
  name:
    type: text
    label: Service name
    comment: Shown on the card and as the filter button on the Projects page.
  description:
    type: textarea
    label: Short description
    comment: One line of examples, e.g. "Decks, patios, driveways and fences."
  photos:
    type: array
    label: Photos
    comment: Photos of this service. They show in the slideshow and on the Projects page. No limit.
    options:
      structures: _structures.photos
  other_photos:
    type: array
    label: Other photos
    comment: Photos that don't belong to one service. They show under "All projects" and in the slideshow.
    options:
      structures: _structures.photos
  src:
    type: image
    label: Photo
    comment: Wide photos around 1600px across load fastest.
    options:
      paths:
        uploads: uploads
  caption:
    type: text
    label: Caption
    comment: Short label shown on the photo. Leave blank to use the service name.
  alt:
    type: text
    label: Description (optional)
    comment: Describes the photo for search engines and screen readers.

_structures:
  services:
    values:
      - label: Service
        icon: handyman
        value:
          name:
          description:
          photos: []
  photos:
    values:
      - label: Photo
        icon: image
        value:
          src:
          caption:
          alt:
